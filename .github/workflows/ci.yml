name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm run ci:check

      - name: Run tests
        run: pnpm run test:ci

      # Runs the leanWorkerBundle generateBundle assertion: fails if a
      # denylisted package (dataforseo-client, autumn-js, ...) re-enters the
      # worker's eager startup graph. See vite-plugin-lean-worker-bundle.ts.
      - name: Build worker (eager-bundle guard)
        run: pnpm vite build

      - name: Install browser for offline report and Maps checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/openseo-browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise project reports and controlled Maps collection
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/openseo-browsers
          PLAYWRIGHT_CHANNEL: chromium
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
        run: |
          pnpm run db:migrate:local
          pnpm exec playwright test e2e/search-workbench.spec.ts e2e/project-investigation.spec.ts
          pnpm exec tsx e2e/maps-fixture/run.ts

      - name: Install website dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run website type checks
        run: pnpm --dir web run types:check

      - name: Build website
        run: pnpm --dir web run build

      - name: Exercise source-built install and cold recovery
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/openseo-browsers
          PLAYWRIGHT_CHANNEL: chromium
        run: sh scripts/test-selfhost-docker.sh
