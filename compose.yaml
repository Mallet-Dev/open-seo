services:
  open-seo:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      AUTH_MODE: local_noauth
      VITE_SHOW_DEVTOOLS: "false"
      PORT: ${PORT:-3001}
      ALLOWED_HOST: ${ALLOWED_HOST:-}
      OPENSEO_TELEMETRY_ENABLED: ${OPENSEO_TELEMETRY_ENABLED:-}
      OPENSEO_TELEMETRY_DISABLED: ${OPENSEO_TELEMETRY_DISABLED:-}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-}
      DATAFORSEO_API_KEY: ${DATAFORSEO_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    volumes:
      - open_seo_data:/app/.wrangler
volumes:
  open_seo_data:
